name: "credential-vault-bridge"
description: "Resolves encrypted API credentials and authentication tokens securely at runtime."
input_schema:
  type: "object"
  properties:
    credential_id:
      type: "string"
      description: "Unique identifier for the encrypted credential record."
    service_type:
      type: "string"
      description: "Target service category e.g. open_ai, anthropic, serper, postgres."
  required:
    - "credential_id"
    - "service_type"
